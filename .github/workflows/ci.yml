name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - name: Test with race detector
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test ./...
      - name: Coverage floors
        if: matrix.os == 'ubuntu-latest'
        # VERIFY: spec section 10 requires 80% on imageref, detect and report.
        run: |
          go test -coverprofile=coverage.out ./...
          sh scripts/cover-floors.sh
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # VERIFY: pinned for reproducible CI; update deliberately.
          version: v2.14.0
      - name: Vulnerability scan
        if: matrix.os == 'ubuntu-latest'
        # VERIFY: pinned for reproducible CI; update deliberately.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
