name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # VERIFY: pinned for reproducible CI; update deliberately.
          version: v2.14.0
      - name: Vulnerability scan
        # VERIFY: pinned for reproducible CI; update deliberately.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
