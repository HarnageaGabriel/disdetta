name: Nightly

on:
  schedule:
    # Every night at 03:37 UTC.
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  race:
    name: Race (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - run: go test -race -count=1 ./...

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Vulnerability scan
        # Pinned for reproducible CI; update deliberately.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
