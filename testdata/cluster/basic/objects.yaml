# Recorded Kubernetes objects for the cluster scan (spec v0.2 section 6).
# A recorded cluster: every workload kind, owner filtering, tier 2 labels and a
# Helm release Secret carrying a gzip-compressed, base64-encoded payload
# (research notes section 9). One Opaque Secret holds a planted token that must
# never appear in any output.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: shop
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: web
    helm.sh/chart: web-1.2.3
  ownerReferences: []
spec:
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        helm.sh/chart: web-1.2.3
    spec:
      containers:
        - name: web
          image: bitnami/nginx:1.25.3
        - name: sidecar
          image: bitnamilegacy/os-shell:1
      ephemeralContainers:
        - name: debug
          image: bitnamilegacy/kubectl:1.29
---
