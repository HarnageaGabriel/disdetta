apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pg
spec:
  chart:
    spec:
      chart: postgresql
      version: 16.7.4
  values:
    architecture: standalone
    auth:
      database: app
      username: app
    primary:
      persistence:
        size: 20Gi
        storageClass: fast
