# Shape of FIWARE/data-space-connector@4f3a596 charts/data-space-connector/templates/otel-restart-job.yaml.
{{- if .Values.otelRestart.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "app.fullname" . }}-otel-restart
spec:
  template:
    spec:
      containers:
        - name: restart
          image: bitnami/kubectl:latest
          command: ["cp", "/opt/bitnami/kubectl/bin"]
          volumeMounts:
            - mountPath: /opt/bitnami/postgresql
              name: data
          postgresqlDataDir: /bitnami/postgresql/data
        - name: sidecar
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag }}"
{{/* image: bitnami/comment-only:1 */}}
# image: bitnami/commented-out:1
{{- end }}