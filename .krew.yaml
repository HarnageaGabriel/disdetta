apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: disdetta
spec:
  version: {{ .TagName }}
  homepage: https://github.com/HarnageaGabriel/disdetta
  shortDescription: Find Bitnami dependencies before migration
  description: Scan repositories and Kubernetes clusters for Bitnami dependencies before migration.
  platforms:
    - selector: {matchLabels: {os: linux, arch: amd64}}
      {{addURIAndSha "https://github.com/HarnageaGabriel/disdetta/releases/download/{{ .TagName }}/disdetta_{{ .TagName }}_linux_amd64.tar.gz" .TagName }}
      bin: disdetta
    - selector: {matchLabels: {os: linux, arch: arm64}}
      {{addURIAndSha "https://github.com/HarnageaGabriel/disdetta/releases/download/{{ .TagName }}/disdetta_{{ .TagName }}_linux_arm64.tar.gz" .TagName }}
      bin: disdetta
    - selector: {matchLabels: {os: darwin, arch: amd64}}
      {{addURIAndSha "https://github.com/HarnageaGabriel/disdetta/releases/download/{{ .TagName }}/disdetta_{{ .TagName }}_darwin_amd64.tar.gz" .TagName }}
      bin: disdetta
    - selector: {matchLabels: {os: darwin, arch: arm64}}
      {{addURIAndSha "https://github.com/HarnageaGabriel/disdetta/releases/download/{{ .TagName }}/disdetta_{{ .TagName }}_darwin_arm64.tar.gz" .TagName }}
      bin: disdetta
    - selector: {matchLabels: {os: windows, arch: amd64}}
      {{addURIAndSha "https://github.com/HarnageaGabriel/disdetta/releases/download/{{ .TagName }}/disdetta_{{ .TagName }}_windows_amd64.zip" .TagName }}
      bin: disdetta.exe
